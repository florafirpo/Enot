name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - name: Tests existentes modificados
        if: github.event_name == 'pull_request'
        run: python scripts/tests_modificados.py || echo "::warning::Hay tests existentes modificados; justificar en el PR"
